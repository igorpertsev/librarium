# Runs on every pull request and on pushes to main. The same checks run locally with `pnpm check`
# (scripts/check.sh), see "Tests, lint, typecheck" in README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly as well, so newly published vulnerabilities show up without a commit (never deploys).
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookstore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bookstore_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Throwaway CI database; the tests refuse to run unless its name ends with _test.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bookstore_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bookstore_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Type check
        run: uv run mypy .
      - name: Migrations apply, match the models and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Tests
        run: uv run pytest -q
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m app.cli export-openapi openapi.json
          git diff --exit-code -- openapi.json || {
            echo "::error file=backend/openapi.json::Out of date. Run: python -m app.cli export-openapi openapi.json"
            exit 1
          }

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      # Reviewed false positives are listed in .gitleaksignore.
      - name: Secrets in the history (gitleaks)
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - name: Known vulnerabilities in the lockfiles (Trivy)
        run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.76.1 fs /src
          --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated API types match backend/openapi.json
        run: |
          pnpm api:types:file
          git diff --exit-code -- src/api/generated || {
            echo "::error file=src/api/generated/schema.d.ts::Out of date. Run: pnpm api:types:file"
            exit 1
          }
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start the test stack (e2e/docker-compose.yml)
        run: pnpm e2e:stack
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm e2e
      - name: API fuzzing (Schemathesis)
        run: pnpm api:fuzz
      - name: Backend logs
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --tail=200 backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # A fresh e2e stack, then Playwright in its Docker image (see e2e/visual.sh).
      - name: Screenshots match e2e/visual/__screenshots__
        run: bash e2e/visual.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-differences
          path: test-results-visual/
          retention-days: 7

  images:
    name: Production images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Placeholders: docker-compose.prod.yml requires them, the build does not use them.
      DOMAIN: ci.example.com
      ACME_EMAIL: ci@example.com
      POSTGRES_PASSWORD: ci-only-not-a-secret
      JWT_SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend and web images
        run: docker compose -f docker-compose.prod.yml build --pull
      # Report only: findings in the base images (Caddy, PostgreSQL's gosu) wait for upstream
      # releases; Dependabot and `build --pull` on deploy bring them in.
      - name: Known vulnerabilities in the images (Trivy, report only)
        run: |
          for image in librarium-backend:prod librarium-web:prod postgres:16-alpine; do
            {
              echo "### $image"
              echo '```'
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.1 \
                image "$image" --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --quiet \
                --format table
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
