[project]
name = "librarium-backend"
version = "0.1.0"
description = "FastAPI backend for the Little Dragon online library"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "sentry-sdk>=2.20",
    "httpx>=0.28",
    "anthropic>=1",
    "pillow>=12",
    "python-multipart>=0.0.20",
    "cryptography>=46",
    "minio==7.2.20",
    "http-ece==1.2.1",
    "py-vapid==1.9.6",
    "webauthn==3.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# The backend is an application, not a distributable package.
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "B", "UP", "SIM", "C4", "RUF", "ASYNC", "S", "BLE", "DTZ", "PT", "RET", "PL",
]
ignore = [
    "PLR0913", # FastAPI endpoints legitimately take many dependencies
    "PLR2004", # magic values in comparisons are fine for HTTP status codes
    "PLR0917", # same as PLR0913 for positional FastAPI dependencies
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "RUF001"]
"app/cli.py" = ["T201"]
# Russian email text: Cyrillic letters are intentional, not look-alike typos.
"app/services/notifications.py" = ["RUF001"]
"app/services/password_reset.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# alembic/ is left out: its directory name would shadow the installed alembic package.
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "http_ece", "py_vapid"]  # untyped
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
