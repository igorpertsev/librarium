# Production stack for a single VM (see deploy/README.md):
#   PostgreSQL + migrations + FastAPI + Caddy (HTTPS, static frontend, /api reverse proxy).
#
#   cp deploy/.env.production.example .env      # fill in the secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80/443). PostgreSQL and the backend are reachable only on the
# internal Docker network. Migrations run on every `up` before the backend starts.

name: librarium-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  ENVIRONMENT: production
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-librarium}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-librarium}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
  MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:-}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: lax
  FRONTEND_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  # Customer emails (optional): without SMTP_HOST they stay queued and are not sent.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_SSL: ${SMTP_SSL:-false}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-Little Dragon Library <no-reply@localhost>}
  APP_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
  # One JSON object per log line (default in production); optional error reporting.
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}
  # Book translations (optional): without ANTHROPIC_API_KEY only Wikidata and Wikipedia are used.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  # Telegram notifications (optional): a bot from @BotFather.
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  # Sign in with Google / Apple (optional).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-}
  TRANSLATION_MODEL: ${TRANSLATION_MODEL:-claude-opus-5-5}
  # Uptime monitoring (optional): the notifier calls this URL every cycle (see deploy/README.md).
  NOTIFIER_PING_URL: ${NOTIFIER_PING_URL:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-librarium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-librarium}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  migrate:
    image: librarium-backend:prod
    build:
      context: ./backend
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  backend:
    image: librarium-backend:prod
    build:
      context: ./backend
      target: runtime
    environment: *backend-env
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  # Sends customer emails (order updates, due-date reminders) every 5 minutes.
  notifier:
    image: librarium-backend:prod
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "app.cli", "notifications", "--loop", "300"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  web:
    image: librarium-web:prod
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - caddy_data:/data # certificates: keep this volume
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
