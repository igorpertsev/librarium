# Local stack: PostgreSQL + migrations + FastAPI backend.
# The frontend keeps its Vite workflow (`pnpm dev`).
#
#   docker compose up -d --build                         # db, migrate, backend
#   docker compose --profile dev run --rm backend-dev pytest
#   Emails sent by the app (notifier) are caught by Mailpit: http://localhost:8025
#
# Variables are read from ./.env (see ./.env.example).

name: librarium

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-bookstore}
  # Empty in development => an ephemeral random secret is generated at startup.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  MFA_ENCRYPTION_KEYS: ${MFA_ENCRYPTION_KEYS:-}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  # Development mail goes to Mailpit (nothing leaves your machine).
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-Little Dragon Library <no-reply@little-dragon.test>}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
  # Optional: machine translation of book descriptions (see .env.example).
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  # Covers in S3-compatible storage instead of the media volume (optional, see .env.example).
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PREFIX: ${S3_PREFIX:-}
  MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  # Notifications on readers' devices (optional, see .env.example).
  WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
  WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
  WEB_PUSH_CONTACT: ${WEB_PUSH_CONTACT:-}
  # Sign in with Google / Apple (optional). In development the backend is not behind
  # APP_BASE_URL, so callbacks go straight to it.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000/api/v1}
  TRANSLATION_MODEL: ${TRANSLATION_MODEL:-claude-opus-5-5}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bookstore}
    ports:
      # Bound to localhost only; 5433 avoids clashing with a PostgreSQL already on 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: librarium-backend:local
    build:
      context: ./backend
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: librarium-backend:local
    build:
      context: ./backend
      target: runtime
    environment: *backend-env
    volumes:
      - media:/app/media
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Delivers customer emails and queues due-date reminders.
  notifier:
    image: librarium-backend:local
    build:
      context: ./backend
      target: runtime
    command: ["python", "-m", "app.cli", "notifications", "--loop", "60"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    restart: unless-stopped

  # Catches all development email; web UI on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  # Tooling container: tests, ruff, mypy, alembic revisions, OpenAPI export.
  backend-dev:
    profiles: ["dev"]
    build:
      context: ./backend
      target: dev
    environment:
      <<: *backend-env
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/bookstore_test
      # The S3 storage tests use the throwaway "s3" service below.
      TEST_S3_ENDPOINT: http://s3:9000
      TEST_S3_ACCESS_KEY: dev-s3-access-key
      TEST_S3_SECRET_KEY: dev-s3-secret-key-not-a-secret
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started

  # S3-compatible storage (RustFS) for the storage tests and for trying S3_BUCKET locally.
  # Test-only credentials; the data is thrown away with the container.
  s3:
    profiles: ["dev"]
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: dev-s3-access-key
      RUSTFS_SECRET_KEY: dev-s3-secret-key-not-a-secret
    ports:
      - "127.0.0.1:9100:9000"

volumes:
  pgdata:
  media:
